[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-harness-core"
version = "0.4.0"
description = "Domain-independent operational harness for Markdown knowledge bases"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "PyYAML>=6.0,<7",
]

# Claim（出典と確度を伴う関係主張）を使う導入先だけが要る。
# pip install "kb-harness-core[claims] @ ..." で入れる。無ければ kb doctor が WARNING で知らせる
[project.optional-dependencies]
claims = [
    "kb-ontology-core @ git+https://github.com/lostandfound/kb-ontology-core.git@v0.2.0",
]

[project.urls]
Homepage = "https://github.com/lostandfound/kb-harness-core"
Repository = "https://github.com/lostandfound/kb-harness-core"

[project.scripts]
kb = "kb_harness.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kb_harness.serve" = [
    "static/*",
    "static/vendor/*",
    "static/ds/*",
    "static/ds/tokens/*",
    "static/ds/assets/fonts/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
